{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}
  <a class="button secondary" href="?page={{ page.previous_page_number }}{% if querystring %}&{{ querystring }}{% endif %}">← Previous</a>
  {% else %}
  <span class="button secondary is-disabled" aria-disabled="true">← Previous</span>
  {% endif %}

  <span class="pagination__count">
    Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total
  </span>

  {% if page.has_next %}
  <a class="button secondary" href="?page={{ page.next_page_number }}{% if querystring %}&{{ querystring }}{% endif %}">Next →</a>
  {% else %}
  <span class="button secondary is-disabled" aria-disabled="true">Next →</span>
  {% endif %}
</nav>
{% endif %}
