{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — NakaVid</title>
    <link rel="stylesheet" href="{% static 'css/nakavid.css' %}" />
    <style>
      /* Standalone: no nav to sign in to yet. */
      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .login-card {
        width: min(24rem, 100%);
      }
      .login-card h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
      }
      .login-card .field {
        margin-bottom: 0.9rem;
      }
      .login-card input {
        width: 100%;
      }
      .login-card button {
        width: 100%;
        margin-top: 0.35rem;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="panel login-card">
        <h1>NakaVid</h1>
        <p class="meta">Sign in to browse the library.</p>

        {% if form.errors %}
        <div class="errors">Invalid username or password.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="field">
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
          </div>
          <div class="field">
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
          </div>
          <button type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </body>
</html>
